<div>
    <div id="text-container">
        <!-- Text inside of our custom tag goes inside the slot tag -->
        <slot></slot>
    </div>

    <div style="background-color: #61f8fb;">
        <!-- Or we can use named slots -->
        <slot name="some-name"></slot>
    </div>
</div>
