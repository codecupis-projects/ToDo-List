<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Inbox</title>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="title">
        Inbox Page
    </header>
    <main class="main">
        <ul class="sections">
            <li class="sections-item">
                <div class="sections-item__move-handle"></div>
                <div class="sections-item__container">
                    <div class="section">
                        <div class="section__title">
                            <div class="section__name"></div>
                            <div class="section__count"></div>
                            <div class="section__ellipsis"></div>
                        </div>
                        <div class="section__list-container">
                            <ul class="section-list">
                                <li class="item">
                                    <div class="item__move-handle"></div>
                                    <div class="item__checklist"></div>
                                    <div class="item__title"></div>
                                    <div class="item__date"></div>
                                    <div class="item__buttons">
                                        <div class="item__button-edit"></div>
                                        <div class="item__button-date"></div>
                                        <div class="item__button-comment"></div>
                                        <div class="item__button-ellipsis"></div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </main>
    
</body>
</html>
