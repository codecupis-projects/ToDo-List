<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="../signup/styles/main.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,300i,400,400i,700,900"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../../assets/icons/todoist.ico"
      type="image/x-icon"
    />
    <title>Todo List - Reset password</title>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img
          class="logo__img"
          src="../../assets/images/icon-todoist.png"
          alt="logo"
        />
        <p class="logo__text">Todo List</p>
      </div>

      <div class="content">
        <div class="content__signup">
          <h1 class="content__title">Forgot your password?</h1>

          <p class="content__reset-info">
            To reset your password, please enter the email address of your
            Todoist account.
          </p>

          <form class="content__form">
            <div class="form__email">
              <p>Email</p>
              <input
                class="form__inputs"
                type="email"
                placeholder="Enter your email..."
                autocomplete="email"
              />
            </div>
            <button class="form__button" type="submit">Log in</button>
          </form>

          <hr />

          <div class="content__signed">
            <a href="../login/index.html">Go to login</a>
          </div>
        </div>

        <div class="content__right-side">
          <img
            class="right-side__img"
            src="../../assets/images/todoist/reset-password.png"
            alt="Sign in"
          />
        </div>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/46675d0a76.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
